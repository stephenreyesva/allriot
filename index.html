<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#1D9E75;--teal-d:#0F6E56;--teal-bg:#E1F5EE;--teal-mid:#5DCAA5;
  --text:#111827;--muted:#6B7280;--hint:#9CA3AF;
  --border:#E5E7EB;--bg:#F9FAFB;--white:#FFFFFF;
  --red-bg:#FEF2F2;--red:#B91C1C;
  --amber-bg:#FFFBEB;--amber:#B45309;
  --blue-bg:#EFF6FF;--blue:#1D4ED8;
  --radius:10px;--radius-sm:6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}
a{color:var(--teal);text-decoration:none;}

/* Layout */
.app{display:flex;min-height:100vh;}
.sidebar{width:220px;background:var(--white);border-right:1px solid var(--border);padding:1.25rem 0.75rem;display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto;}
.main{margin-left:220px;flex:1;padding:2rem 2.5rem;max-width:980px;}

/* Sidebar */
.logo{padding:0 0.5rem 1.25rem;border-bottom:1px solid var(--border);margin-bottom:1rem;}
.logo-name{font-size:14px;font-weight:600;color:var(--text);}
.logo-role{font-size:11px;color:var(--muted);margin-top:1px;}
.logo-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-right:6px;vertical-align:middle;}
.nav-section{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--hint);padding:0 0.5rem;margin:0.75rem 0 0.25rem;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius-sm);font-size:13px;color:var(--muted);cursor:pointer;margin-bottom:1px;transition:all 0.12s;border:none;background:none;width:100%;text-align:left;font-family:'DM Sans',sans-serif;}
.nav-item:hover{background:var(--bg);color:var(--text);}
.nav-item.active{background:var(--teal-bg);color:var(--teal);font-weight:500;}
.nav-item svg{flex-shrink:0;opacity:0.7;}
.nav-item.active svg{opacity:1;}
.sidebar-bottom{margin-top:auto;padding-top:1rem;border-top:1px solid var(--border);}
.sidebar-client{font-size:11px;color:var(--muted);padding:0.5rem;}
.sidebar-client span{display:block;font-weight:500;color:var(--text);font-size:12px;}

/* View banner */
.view-banner{background:var(--teal-bg);border:1px solid var(--teal-mid);border-radius:var(--radius);padding:10px 16px;margin-bottom:1.5rem;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--teal-d);}
.view-banner strong{font-weight:500;}

/* Page header */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;}
.page-title{font-size:18px;font-weight:500;}
.page-sub{font-size:13px;color:var(--muted);margin-top:1px;}
.btn-group{display:flex;gap:8px;align-items:center;}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 15px;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;border:none;font-weight:500;transition:all 0.12s;line-height:1;}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--teal-d);}
.btn-outline{background:var(--white);border:1px solid var(--border);color:var(--muted);}
.btn-outline:hover{border-color:var(--teal);color:var(--teal);}
.btn-ghost{background:none;border:none;color:var(--muted);padding:6px 8px;}
.btn-ghost:hover{color:var(--text);background:var(--bg);}
.btn-danger{background:var(--red-bg);color:var(--red);border:none;}
.btn-danger:hover{background:#fee2e2;}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-icon{padding:5px;width:30px;height:30px;justify-content:center;border-radius:var(--radius-sm);}

/* Stats grid */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.75rem;}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:8px;}
.stat-value{font-size:24px;font-weight:500;letter-spacing:-0.02em;}
.stat-value.teal{color:var(--teal);}
.stat-sub{font-size:11px;color:var(--muted);margin-top:4px;}

/* Card */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.card-header{padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:14px;font-weight:500;}

/* Table */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead th{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);font-weight:500;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap;}
tbody td{padding:9px 14px;font-size:13px;vertical-align:middle;border-bottom:1px solid var(--border);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#fafafa;}

/* Inline inputs */
.ci{background:transparent;border:none;border-bottom:1px solid transparent;outline:none;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);padding:1px 2px;width:100%;transition:border-color 0.12s;}
.ci:focus{border-bottom-color:var(--teal);}
.ci::placeholder{color:var(--hint);}
.ci[type=number]{text-align:right;}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap;}
.badge-draft{background:#F3F4F6;color:#6B7280;}
.badge-sent{background:var(--blue-bg);color:var(--blue);}
.badge-paid{background:var(--teal-bg);color:var(--teal-d);}
.badge-overdue{background:var(--red-bg);color:var(--red);}
.badge-pending{background:var(--amber-bg);color:var(--amber);}

/* Status select (edit mode) */
.status-sel{border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.04em;cursor:pointer;padding:3px 6px;border-radius:100px;appearance:none;-webkit-appearance:none;}
.status-sel.draft{background:#F3F4F6;color:#6B7280;}
.status-sel.sent{background:var(--blue-bg);color:var(--blue);}
.status-sel.paid{background:var(--teal-bg);color:var(--teal-d);}
.status-sel.overdue{background:var(--red-bg);color:var(--red);}
.status-sel.pending{background:var(--amber-bg);color:var(--amber);}

/* Delete btn */
.delbtn{background:none;border:none;cursor:pointer;color:var(--hint);padding:3px 5px;border-radius:4px;line-height:1;font-size:15px;transition:all 0.12s;}
.delbtn:hover{color:var(--red);background:var(--red-bg);}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:200;padding:1rem;}
.modal{background:var(--white);border-radius:var(--radius);padding:1.75rem;width:460px;max-width:100%;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:16px;font-weight:500;margin-bottom:1.5rem;}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--border);}

/* Form */
.form-group{margin-bottom:1rem;}
.form-label{font-size:12px;color:var(--muted);margin-bottom:5px;display:block;}
.form-input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color 0.12s;background:var(--white);color:var(--text);}
.form-input:focus{border-color:var(--teal);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;background:var(--white);color:var(--text);}
.form-select:focus{border-color:var(--teal);}
.form-hint{font-size:11px;color:var(--muted);margin-top:4px;}
.form-section{font-size:12px;font-weight:500;color:var(--muted);margin:1.25rem 0 0.75rem;padding-top:1rem;border-top:1px solid var(--border);}

/* Empty state */
.empty{text-align:center;padding:3.5rem 1rem;color:var(--muted);}
.empty-icon{font-size:32px;margin-bottom:12px;opacity:0.3;}
.empty p{font-size:13px;margin-bottom:1rem;}

/* Settings */
.settings-section{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1.25rem;}
.settings-title{font-size:13px;font-weight:500;margin-bottom:1rem;padding-bottom:8px;border-bottom:1px solid var(--border);}
.share-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;font-family:monospace;word-break:break-all;color:var(--muted);}
.info-box{background:var(--teal-bg);border:1px solid var(--teal-mid);border-radius:var(--radius-sm);padding:12px 14px;font-size:12px;color:var(--teal-d);line-height:1.6;}
.info-box strong{font-weight:500;}

/* Notification toast */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--text);color:#fff;padding:10px 18px;border-radius:var(--radius-sm);font-size:13px;z-index:999;opacity:0;transform:translateY(8px);transition:all 0.2s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}

/* Recent entries on dashboard */
.entry-row-mini{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
.entry-row-mini:last-child{border-bottom:none;}
.period-pill{display:inline-block;font-size:10px;padding:2px 8px;background:var(--bg);border:1px solid var(--border);border-radius:100px;color:var(--muted);margin-left:6px;vertical-align:middle;}

/* Responsive */
@media(max-width:700px){
  .sidebar{display:none;}
  .main{margin-left:0;padding:1rem;}
  .stats-grid{grid-template-columns:1fr 1fr;}
  .form-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
// ─── Constants ───────────────────────────────────────────────
const RATE = 5;
const STATUSES = ['draft','sent','pending','paid','overdue'];
const STATUS_LABELS = {draft:'Draft',sent:'Sent',pending:'Pending',paid:'Paid',overdue:'Overdue'};
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// ─── State ────────────────────────────────────────────────────
let page = 'dashboard';
let modal = null;
let viewMode = false;
let data = {
  profile:{name:'',role:'E-Commerce Virtual Assistant',rate:5},
  client:{name:'',company:''},
  payment:{bank:'',accountName:'',accountNumber:'',swift:''},
  entries:[],
  invoices:[],
  github:{user:'',repo:'',token:'',branch:'main'}
};

// ─── Data persistence ─────────────────────────────────────────
function save(){
  if(!viewMode) localStorage.setItem('ttracker_v1', JSON.stringify(data));
}

function load(){
  const raw = localStorage.getItem('ttracker_v1');
  if(raw){ try{ data = JSON.parse(raw); }catch(e){} }
}

// ─── Helpers ─────────────────────────────────────────────────
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function fmt(n){ return '$' + parseFloat(n).toFixed(2); }

function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

function totalHours(entries){ return entries.reduce((s,e)=>s+(parseFloat(e.hours)||0),0); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function getMonthEntries(month, year){
  return data.entries.filter(e=>{
    if(!e.date) return false;
    const d = new Date(e.date + 'T00:00:00');
    return d.getMonth()===month && d.getFullYear()===year;
  });
}

// ─── View mode detection ──────────────────────────────────────
async function detectMode(){
  const params = new URLSearchParams(window.location.search);
  if(params.has('view')){
    viewMode = true;
    try{
      const res = await fetch('./data.json?t='+Date.now());
      if(res.ok){ data = await res.json(); }
      else{ viewMode = false; }
    }catch(e){ viewMode = false; }
  }
}

// ─── Export / sync ────────────────────────────────────────────
function exportJSON(){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'data.json';
  a.click();
  toast('data.json downloaded — commit it to your repo!');
}

async function syncGitHub(){
  const {user,repo,token,branch} = data.github;
  if(!user||!repo||!token){ toast('Fill in GitHub settings first.'); return; }
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
  const path = 'data.json';
  const api = `https://api.github.com/repos/${user}/${repo}/contents/${path}`;
  try{
    let sha = '';
    const existing = await fetch(api, {headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}});
    if(existing.ok){ const j = await existing.json(); sha = j.sha; }
    const body = {message:'update time tracker data',content,branch};
    if(sha) body.sha = sha;
    const res = await fetch(api,{method:'PUT',headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)});
    if(res.ok){ toast('Synced to GitHub successfully!'); }
    else{ const err = await res.json(); toast('Error: '+(err.message||'sync failed')); }
  }catch(e){ toast('Sync failed — check token/repo name.'); }
}

// ─── Render ───────────────────────────────────────────────────
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(renderSidebar());
  const main = document.createElement('div');
  main.className = 'main';
  if(viewMode){
    const b = document.createElement('div');
    b.className = 'view-banner';
    b.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg><span>You're viewing <strong>${data.profile.name||'this tracker'}'s</strong> live time tracker — read only.</span>`;
    main.appendChild(b);
  }
  const pages = {dashboard:renderDashboard,timesheet:renderTimesheet,invoices:renderInvoices,settings:renderSettings};
  main.appendChild((pages[page]||renderDashboard)());
  app.appendChild(main);
  if(modal) app.appendChild(renderModal());
}

// ─── Sidebar ──────────────────────────────────────────────────
function renderSidebar(){
  const sb = document.createElement('div');
  sb.className = 'sidebar';
  const logo = document.createElement('div');
  logo.className = 'logo';
  logo.innerHTML = `<div class="logo-name"><span class="logo-dot"></span>${data.profile.name||'My Tracker'}</div><div class="logo-role">${data.profile.role||'VA'}</div>`;
  sb.appendChild(logo);
  const navItems = [
    {id:'dashboard',label:'Dashboard',icon:'<path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>'},
    {id:'timesheet',label:'Timesheet',icon:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>'},
    {id:'invoices',label:'Invoices',icon:'<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>'},
  ];
  if(!viewMode) navItems.push({id:'settings',label:'Settings',icon:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>'});
  navItems.forEach(item=>{
    const btn = document.createElement('button');
    btn.className = 'nav-item' + (page===item.id?' active':'');
    btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${item.icon}</svg>${item.label}`;
    btn.addEventListener('click',()=>{ page=item.id; render(); });
    sb.appendChild(btn);
  });
  if(data.client.name){
    const bot = document.createElement('div');
    bot.className = 'sidebar-bottom';
    bot.innerHTML = `<div class="sidebar-client">Billing to<span>${data.client.name}${data.client.company?'\n'+data.client.company:''}</span></div>`;
    sb.appendChild(bot);
  }
  return sb;
}

// ─── Dashboard ────────────────────────────────────────────────
function renderDashboard(){
  const now = new Date();
  const thisMonth = getMonthEntries(now.getMonth(), now.getFullYear());
  const allHours = totalHours(data.entries);
  const thisHours = totalHours(thisMonth);
  const unpaidTotal = data.invoices.filter(i=>i.status!=='paid').reduce((s,i)=>s+(parseFloat(i.total)||0),0);
  const div = document.createElement('div');
  div.innerHTML = `
    <div class="page-header">
      <div><div class="page-title">Dashboard</div><div class="page-sub">${MONTHS[now.getMonth()]} ${now.getFullYear()}</div></div>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">This month hours</div><div class="stat-value teal">${thisHours.toFixed(1)}</div><div class="stat-sub">${fmt(thisHours*RATE)} earned</div></div>
      <div class="stat-card"><div class="stat-label">Total hours logged</div><div class="stat-value">${allHours.toFixed(1)}</div><div class="stat-sub">All time</div></div>
      <div class="stat-card"><div class="stat-label">Outstanding</div><div class="stat-value">${fmt(unpaidTotal)}</div><div class="stat-sub">Across ${data.invoices.filter(i=>i.status!=='paid').length} invoice(s)</div></div>
    </div>`;
  // Recent entries
  const recent = [...data.entries].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="card-header"><div class="card-title">Recent entries</div></div>`;
  const body = document.createElement('div');
  body.style.padding = '0 1.25rem';
  if(recent.length===0){ body.innerHTML = '<div class="empty"><div class="empty-icon">📋</div><p>No entries yet. Go to Timesheet to log your hours.</p></div>'; }
  else{
    recent.forEach(e=>{
      const row = document.createElement('div');
      row.className = 'entry-row-mini';
      row.innerHTML = `<div><span style="color:var(--muted);font-size:11px;margin-right:8px;">${fmtDate(e.date)}</span>${e.description||'<span style="color:var(--hint)">No description</span>'}</div><div style="white-space:nowrap;color:var(--teal);font-weight:500;">${fmt((parseFloat(e.hours)||0)*RATE)}<span style="color:var(--hint);font-weight:400;font-size:11px;margin-left:4px;">${e.hours||0}h</span></div>`;
      body.appendChild(row);
    });
  }
  card.appendChild(body);
  div.appendChild(card);

  // Invoices summary
  if(data.invoices.length>0){
    const icard = document.createElement('div');
    icard.className = 'card';
    icard.style.marginTop = '1.25rem';
    icard.innerHTML = `<div class="card-header"><div class="card-title">Invoice status</div></div>`;
    const ibody = document.createElement('div');
    ibody.style.padding = '0 1.25rem';
    [...data.invoices].reverse().slice(0,4).forEach(inv=>{
      const row = document.createElement('div');
      row.className = 'entry-row-mini';
      row.innerHTML = `<div>${inv.number}<span class="period-pill">${inv.label||'—'}</span></div><div style="display:flex;align-items:center;gap:10px;"><span class="badge badge-${inv.status||'draft'}">${STATUS_LABELS[inv.status||'draft']}</span><span style="font-weight:500;">${fmt(inv.total||0)}</span></div>`;
      ibody.appendChild(row);
    });
    icard.appendChild(ibody);
    div.appendChild(icard);
  }
  return div;
}

// ─── Timesheet ────────────────────────────────────────────────
function renderTimesheet(){
  const div = document.createElement('div');
  const sorted = [...data.entries].sort((a,b)=>b.date.localeCompare(a.date));
  const totalH = totalHours(data.entries);
  const header = document.createElement('div');
  header.className = 'page-header';
  header.innerHTML = `<div><div class="page-title">Timesheet</div><div class="page-sub">Rate: $${RATE}/hr · ${totalH.toFixed(1)} hrs total · ${fmt(totalH*RATE)} earned</div></div>`;
  if(!viewMode){
    const addBtn = document.createElement('button');
    addBtn.className = 'btn btn-primary';
    addBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add entry`;
    addBtn.addEventListener('click',()=>openEntryModal());
    header.appendChild(addBtn);
  }
  div.appendChild(header);
  const card = document.createElement('div');
  card.className = 'card';
  if(sorted.length===0){
    card.innerHTML = `<div class="empty"><div class="empty-icon">⏱</div><p>No time entries yet.</p>${!viewMode?'<button class="btn btn-primary btn-sm" onclick="openEntryModal()">Log your first entry</button>':''}</div>`;
  } else {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    const tbl = document.createElement('table');
    tbl.innerHTML = `<thead><tr><th>Date</th><th>Description</th><th style="text-align:right">Hours</th><th style="text-align:right">Amount</th>${!viewMode?'<th></th>':''}</tr></thead>`;
    const tbody = document.createElement('tbody');
    sorted.forEach(e=>{
      const tr = document.createElement('tr');
      const amt = (parseFloat(e.hours)||0)*RATE;
      tr.innerHTML = `<td style="white-space:nowrap;color:var(--muted)">${fmtDate(e.date)}</td><td>${e.description||'<span style="color:var(--hint)">—</span>'}</td><td style="text-align:right;font-variant-numeric:tabular-nums">${e.hours||0}h</td><td style="text-align:right;font-weight:500;color:var(--teal)">${fmt(amt)}</td>`;
      if(!viewMode){
        const td = document.createElement('td');
        td.style.textAlign = 'right';
        const btn = document.createElement('button');
        btn.className = 'delbtn';
        btn.title = 'Delete';
        btn.innerHTML = '×';
        btn.addEventListener('click',()=>{ data.entries=data.entries.filter(x=>x.id!==e.id); save(); render(); });
        td.appendChild(btn);
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    });
    // Totals row
    const tfoot = document.createElement('tfoot');
    tfoot.innerHTML = `<tr style="background:var(--bg)"><td colspan="2" style="padding:10px 14px;font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:0.06em;">Total</td><td style="text-align:right;padding:10px 14px;font-weight:500">${totalH.toFixed(1)}h</td><td style="text-align:right;padding:10px 14px;font-weight:500;color:var(--teal)">${fmt(totalH*RATE)}</td>${!viewMode?'<td></td>':''}</tr>`;
    tbl.appendChild(tbody); tbl.appendChild(tfoot);
    wrap.appendChild(tbl);
    card.appendChild(wrap);
  }
  div.appendChild(card);
  return div;
}

// ─── Invoices ─────────────────────────────────────────────────
function renderInvoices(){
  const div = document.createElement('div');
  const header = document.createElement('div');
  header.className = 'page-header';
  header.innerHTML = `<div><div class="page-title">Invoices</div><div class="page-sub">${data.invoices.length} invoice(s) · ${data.invoices.filter(i=>i.status==='paid').length} paid</div></div>`;
  if(!viewMode){
    const addBtn = document.createElement('button');
    addBtn.className = 'btn btn-primary';
    addBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> New invoice`;
    addBtn.addEventListener('click',()=>openInvoiceModal());
    header.appendChild(addBtn);
  }
  div.appendChild(header);
  const card = document.createElement('div');
  card.className = 'card';
  if(data.invoices.length===0){
    card.innerHTML = `<div class="empty"><div class="empty-icon">🧾</div><p>No invoices yet.</p>${!viewMode?'<button class="btn btn-primary btn-sm" onclick="openInvoiceModal()">Create your first invoice</button>':''}</div>`;
  } else {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    const tbl = document.createElement('table');
    tbl.innerHTML = `<thead><tr><th>Invoice</th><th>Period</th><th style="text-align:right">Hours</th><th style="text-align:right">Amount</th><th>Status</th><th>Notes</th>${!viewMode?'<th></th>':''}</tr></thead>`;
    const tbody = document.createElement('tbody');
    [...data.invoices].reverse().forEach(inv=>{
      const tr = document.createElement('tr');
      // Status cell
      const statusCell = document.createElement('td');
      if(!viewMode){
        const sel = document.createElement('select');
        sel.className = 'status-sel ' + (inv.status||'draft');
        STATUSES.forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=STATUS_LABELS[s]; if(s===inv.status)o.selected=true; sel.appendChild(o); });
        sel.addEventListener('change',e=>{ inv.status=e.target.value; sel.className='status-sel '+e.target.value; save(); toast('Status updated to '+STATUS_LABELS[e.target.value]); render(); });
        statusCell.appendChild(sel);
      } else {
        statusCell.innerHTML = `<span class="badge badge-${inv.status||'draft'}">${STATUS_LABELS[inv.status||'draft']}</span>`;
      }
      // Notes cell (inline edit)
      const notesCell = document.createElement('td');
      if(!viewMode){
        const ni = document.createElement('input');
        ni.className = 'ci'; ni.placeholder = 'Add note…'; ni.value = inv.notes||''; ni.style.minWidth='100px';
        ni.addEventListener('change',e=>{ inv.notes=e.target.value; save(); });
        notesCell.appendChild(ni);
      } else {
        notesCell.textContent = inv.notes||'—';
        notesCell.style.color = 'var(--muted)';
      }
      tr.innerHTML = `<td style="font-weight:500">${inv.number}</td><td style="white-space:nowrap;color:var(--muted);font-size:12px">${inv.label||'—'}</td><td style="text-align:right">${parseFloat(inv.hours||0).toFixed(1)}h</td><td style="text-align:right;font-weight:500;color:var(--teal)">${fmt(inv.total||0)}</td>`;
      tr.appendChild(statusCell);
      tr.appendChild(notesCell);
      if(!viewMode){
        const tdDel = document.createElement('td');
        tdDel.style.textAlign='right';
        const btn = document.createElement('button');
        btn.className='delbtn'; btn.title='Delete'; btn.innerHTML='×';
        btn.addEventListener('click',()=>{ data.invoices=data.invoices.filter(x=>x.id!==inv.id); save(); render(); });
        tdDel.appendChild(btn);
        tr.appendChild(tdDel);
      }
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    wrap.appendChild(tbl);
    card.appendChild(wrap);
  }
  div.appendChild(card);
  return div;
}

// ─── Settings ─────────────────────────────────────────────────
function renderSettings(){
  const div = document.createElement('div');
  div.innerHTML = `<div class="page-header"><div class="page-title">Settings</div></div>`;

  // Profile
  const profile = document.createElement('div');
  profile.className = 'settings-section';
  profile.innerHTML = `<div class="settings-title">Your profile</div>`;
  const pg = makeFormGroup('Your name','text',data.profile.name,'Your full name',v=>{ data.profile.name=v; save(); });
  const rg = makeFormGroup('Role / service','text',data.profile.role,'e.g. E-Commerce VA',v=>{ data.profile.role=v; save(); });
  profile.appendChild(pg); profile.appendChild(rg);
  div.appendChild(profile);

  // Client
  const client = document.createElement('div');
  client.className = 'settings-section';
  client.innerHTML = `<div class="settings-title">Client info</div>`;
  client.appendChild(makeFormGroup('Client name','text',data.client.name,'Full name',v=>{ data.client.name=v; save(); }));
  client.appendChild(makeFormGroup('Company','text',data.client.company,'Company name',v=>{ data.client.company=v; save(); }));
  div.appendChild(client);

  // Payment
  const pay = document.createElement('div');
  pay.className = 'settings-section';
  pay.innerHTML = `<div class="settings-title">Payment details</div>`;
  pay.appendChild(makeFormGroup('Bank name','text',data.payment.bank,'',v=>{ data.payment.bank=v; save(); }));
  pay.appendChild(makeFormGroup('Account holder name','text',data.payment.accountName,'',v=>{ data.payment.accountName=v; save(); }));
  pay.appendChild(makeFormGroup('Account number','text',data.payment.accountNumber,'',v=>{ data.payment.accountNumber=v; save(); }));
  pay.appendChild(makeFormGroup('SWIFT / IBAN','text',data.payment.swift,'Optional',v=>{ data.payment.swift=v; save(); }));
  div.appendChild(pay);

  // GitHub sync
  const gh = document.createElement('div');
  gh.className = 'settings-section';
  gh.innerHTML = `<div class="settings-title">GitHub sync (optional)</div><div class="info-box" style="margin-bottom:1rem"><strong>How it works:</strong> Enter your GitHub details and click "Sync to GitHub" to push your data to <code>data.json</code> in your repo. Your client opens <code>yourusername.github.io/yourrepo/?view</code> to see the live view. Or use "Export data.json" to download and commit manually.</div>`;
  gh.appendChild(makeFormGroup('GitHub username','text',data.github.user,'',v=>{ data.github.user=v; save(); }));
  gh.appendChild(makeFormGroup('Repository name','text',data.github.repo,'e.g. my-timetracker',v=>{ data.github.repo=v; save(); }));
  gh.appendChild(makeFormGroup('Personal access token','password',data.github.token,'Needs "contents" write scope',v=>{ data.github.token=v; save(); }));
  gh.appendChild(makeFormGroup('Branch','text',data.github.branch||'main','',v=>{ data.github.branch=v; save(); }));
  const ghBtns = document.createElement('div');
  ghBtns.style.cssText='display:flex;gap:8px;margin-top:1rem;';
  const syncBtn = document.createElement('button');
  syncBtn.className='btn btn-primary';
  syncBtn.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg> Sync to GitHub`;
  syncBtn.addEventListener('click', syncGitHub);
  const expBtn = document.createElement('button');
  expBtn.className='btn btn-outline';
  expBtn.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export data.json`;
  expBtn.addEventListener('click', exportJSON);
  ghBtns.appendChild(syncBtn); ghBtns.appendChild(expBtn);
  gh.appendChild(ghBtns);
  if(data.github.user && data.github.repo){
    const shareUrl = `https://${data.github.user}.github.io/${data.github.repo}/?view`;
    const shareDiv = document.createElement('div');
    shareDiv.style.marginTop='1rem';
    shareDiv.innerHTML=`<div class="form-label">Client view URL</div><div class="share-box">${shareUrl}</div><div class="form-hint" style="margin-top:6px">Share this URL with your client. It updates automatically after each sync.</div>`;
    gh.appendChild(shareDiv);
  }
  div.appendChild(gh);

  // Danger zone
  const danger = document.createElement('div');
  danger.className = 'settings-section';
  danger.innerHTML = `<div class="settings-title">Data</div>`;
  const clrBtn = document.createElement('button');
  clrBtn.className = 'btn btn-danger';
  clrBtn.textContent = 'Clear all data';
  clrBtn.addEventListener('click',()=>{
    if(confirm('Delete all entries, invoices and settings? This cannot be undone.')){ localStorage.removeItem('ttracker_v1'); data={profile:{name:'',role:'E-Commerce Virtual Assistant',rate:5},client:{name:'',company:''},payment:{bank:'',accountName:'',accountNumber:'',swift:''},entries:[],invoices:[],github:{user:'',repo:'',token:'',branch:'main'}}; render(); toast('All data cleared.'); }
  });
  danger.appendChild(clrBtn);
  div.appendChild(danger);
  return div;
}

function makeFormGroup(label, type, value, placeholder, onChange){
  const g = document.createElement('div');
  g.className = 'form-group';
  const l = document.createElement('label');
  l.className = 'form-label'; l.textContent = label;
  const i = document.createElement('input');
  i.className = 'form-input'; i.type = type; i.value = value||''; i.placeholder = placeholder||'';
  i.addEventListener('change',e=>onChange(e.target.value));
  g.appendChild(l); g.appendChild(i);
  return g;
}

// ─── Modals ───────────────────────────────────────────────────
function openEntryModal(){
  const today = new Date().toISOString().slice(0,10);
  modal = {
    type:'entry',
    data:{date:today,description:'',hours:''},
    onSave(){
      if(!this.data.hours||isNaN(parseFloat(this.data.hours))){ toast('Please enter valid hours.'); return; }
      data.entries.push({id:uid(),...this.data});
      save(); modal=null; render(); toast('Entry added!');
    }
  };
  render();
}

function openInvoiceModal(){
  const nextNum = 'INV-' + String(data.invoices.length+1).padStart(3,'0');
  modal = {
    type:'invoice',
    data:{number:nextNum,label:'',hours:'',total:'',status:'draft',notes:''},
    onSave(){
      if(!this.data.number){ toast('Invoice number required.'); return; }
      const h = parseFloat(this.data.hours)||0;
      const t = parseFloat(this.data.total)||h*RATE;
      data.invoices.push({id:uid(),...this.data,hours:h,total:t});
      save(); modal=null; render(); toast('Invoice created!');
    }
  };
  render();
}

function renderModal(){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.addEventListener('click',e=>{ if(e.target===overlay){ modal=null; render(); } });
  const m = document.createElement('div');
  m.className = 'modal';

  if(modal.type==='entry'){
    m.innerHTML = `<div class="modal-title">Log time entry</div>`;
    m.appendChild(makeFormGroup('Date','date',modal.data.date,'',v=>modal.data.date=v));
    m.appendChild(makeFormGroup('Description','text',modal.data.description,'What did you work on?',v=>modal.data.description=v));
    m.appendChild(makeFormGroup('Hours worked','number',modal.data.hours,'e.g. 2.5',v=>modal.data.hours=v));
    const foot = document.createElement('div');
    foot.className = 'modal-footer';
    const cancel = document.createElement('button');
    cancel.className='btn btn-outline'; cancel.textContent='Cancel';
    cancel.addEventListener('click',()=>{ modal=null; render(); });
    const save_btn = document.createElement('button');
    save_btn.className='btn btn-primary'; save_btn.textContent='Save entry';
    save_btn.addEventListener('click',()=>modal.onSave());
    foot.appendChild(cancel); foot.appendChild(save_btn);
    m.appendChild(foot);
  }

  if(modal.type==='invoice'){
    m.innerHTML = `<div class="modal-title">Create invoice</div>`;
    const row = document.createElement('div'); row.className='form-row';
    const ng = makeFormGroup('Invoice number','text',modal.data.number,'INV-001',v=>modal.data.number=v);
    const sg = document.createElement('div'); sg.className='form-group';
    sg.innerHTML=`<label class="form-label">Status</label>`;
    const sel = document.createElement('select'); sel.className='form-select';
    STATUSES.forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=STATUS_LABELS[s]; if(s===modal.data.status)o.selected=true; sel.appendChild(o); });
    sel.addEventListener('change',e=>modal.data.status=e.target.value);
    sg.appendChild(sel);
    row.appendChild(ng); row.appendChild(sg);
    m.appendChild(row);
    m.appendChild(makeFormGroup('Period label','text',modal.data.label,'e.g. May 1–15, 2026',v=>modal.data.label=v));
    const row2 = document.createElement('div'); row2.className='form-row';
    const hg = makeFormGroup('Hours','number',modal.data.hours,'Total hours',v=>{ modal.data.hours=v; modal.data.total=(parseFloat(v)||0)*RATE+''; });
    const tg = makeFormGroup('Total amount ($)','number',modal.data.total,'Auto from hours',v=>modal.data.total=v);
    row2.appendChild(hg); row2.appendChild(tg); m.appendChild(row2);
    m.appendChild(makeFormGroup('Notes','text',modal.data.notes,'Optional notes',v=>modal.data.notes=v));
    const hint = document.createElement('p'); hint.className='form-hint'; hint.style.marginTop='-6px'; hint.textContent=`Rate: $${RATE}/hr. Fill hours and total auto-calculates.`;
    m.appendChild(hint);
    const foot = document.createElement('div'); foot.className='modal-footer';
    const cancel = document.createElement('button'); cancel.className='btn btn-outline'; cancel.textContent='Cancel';
    cancel.addEventListener('click',()=>{ modal=null; render(); });
    const save_btn = document.createElement('button'); save_btn.className='btn btn-primary'; save_btn.textContent='Create invoice';
    save_btn.addEventListener('click',()=>modal.onSave());
    foot.appendChild(cancel); foot.appendChild(save_btn); m.appendChild(foot);
  }

  overlay.appendChild(m);
  return overlay;
}

// make modal funcs global so inline onclick works
window.openEntryModal = openEntryModal;
window.openInvoiceModal = openInvoiceModal;

// ─── Init ─────────────────────────────────────────────────────
load();
detectMode().then(render);
</script>

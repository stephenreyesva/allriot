<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Stephen Reyes Time Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#1D9E75;--teal-d:#0F6E56;--teal-bg:#E1F5EE;--teal-mid:#5DCAA5;
  --text:#111827;--muted:#6B7280;--hint:#9CA3AF;
  --border:#E5E7EB;--bg:#F9FAFB;--white:#FFFFFF;
  --red-bg:#FEF2F2;--red:#B91C1C;
  --amber-bg:#FFFBEB;--amber:#B45309;
  --blue-bg:#EFF6FF;--blue:#1D4ED8;
  --radius:10px;--radius-sm:6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}

/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);}
.login-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;width:360px;max-width:95vw;}
.login-logo{text-align:center;margin-bottom:2rem;}
.login-logo-name{font-size:18px;font-weight:600;}
.login-logo-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal);margin-right:7px;vertical-align:middle;}
.login-logo-role{font-size:12px;color:var(--muted);margin-top:4px;}
.login-subtitle{font-size:13px;color:var(--muted);text-align:center;margin-bottom:1.5rem;}
.login-error{background:var(--red-bg);color:var(--red);font-size:12px;padding:8px 12px;border-radius:var(--radius-sm);margin-bottom:1rem;display:none;}
.login-error.show{display:block;}
.admin-badge{display:inline-block;font-size:10px;padding:2px 8px;background:var(--amber-bg);color:var(--amber);border-radius:100px;font-weight:500;text-transform:uppercase;letter-spacing:0.04em;margin-top:6px;}

/* App */
.app{display:flex;min-height:100vh;}
.sidebar{width:230px;background:var(--white);border-right:1px solid var(--border);padding:1.25rem 0.75rem;display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto;}
.main{margin-left:230px;flex:1;padding:2rem 2.5rem;max-width:980px;}

/* Sidebar */
.logo{padding:0 0.5rem 1.25rem;border-bottom:1px solid var(--border);margin-bottom:1rem;}
.logo-name{font-size:14px;font-weight:600;}
.logo-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-right:6px;vertical-align:middle;}
.logo-email{font-size:11px;color:var(--muted);margin-top:2px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius-sm);font-size:13px;color:var(--muted);cursor:pointer;margin-bottom:1px;transition:all 0.12s;border:none;background:none;width:100%;text-align:left;font-family:'DM Sans',sans-serif;}
.nav-item:hover{background:var(--bg);color:var(--text);}
.nav-item.active{background:var(--teal-bg);color:var(--teal);font-weight:500;}
.nav-item svg{flex-shrink:0;opacity:0.7;}
.nav-item.active svg{opacity:1;}
.sidebar-bottom{margin-top:auto;padding-top:1rem;border-top:1px solid var(--border);}
.sb-info{font-size:11px;color:var(--muted);padding:0.4rem 0.5rem;}
.sb-info span{display:block;font-weight:500;color:var(--text);font-size:12px;margin-top:1px;}

/* Sync bar */
.sync-bar{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:0.875rem 1.25rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sync-label{font-size:12px;color:var(--muted);white-space:nowrap;}

/* Page header */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:10px;}
.page-title{font-size:18px;font-weight:500;}
.page-sub{font-size:13px;color:var(--muted);margin-top:1px;}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 15px;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;border:none;font-weight:500;transition:all 0.12s;line-height:1;}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--teal-d);}
.btn-outline{background:var(--white);border:1px solid var(--border);color:var(--muted);}
.btn-outline:hover{border-color:var(--teal);color:var(--teal);}
.btn-ghost{background:none;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;}
.btn-danger{background:var(--red-bg);color:var(--red);border:none;}
.btn-danger:hover{background:#fee2e2;}
.btn-sm{padding:5px 10px;font-size:12px;}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.75rem;}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:8px;}
.stat-value{font-size:24px;font-weight:500;letter-spacing:-0.02em;}
.stat-value.teal{color:var(--teal);}
.stat-sub{font-size:11px;color:var(--muted);margin-top:4px;}

/* Card */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.card-header{padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.card-title{font-size:14px;font-weight:500;}

/* Table */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead th{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);font-weight:500;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap;}
tbody td{padding:9px 14px;font-size:13px;vertical-align:middle;border-bottom:1px solid var(--border);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#fafafa;}
tfoot td{padding:10px 14px;font-size:12px;background:var(--bg);}

/* Inline inputs */
.ci{background:transparent;border:none;border-bottom:1px solid transparent;outline:none;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);padding:1px 2px;width:100%;transition:border-color 0.12s;}
.ci:focus{border-bottom-color:var(--teal);}
.ci::placeholder{color:var(--hint);}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap;}
.badge-draft{background:#F3F4F6;color:#6B7280;}
.badge-sent{background:var(--blue-bg);color:var(--blue);}
.badge-paid{background:var(--teal-bg);color:var(--teal-d);}
.badge-overdue{background:var(--red-bg);color:var(--red);}
.badge-pending{background:var(--amber-bg);color:var(--amber);}

/* Status select */
.status-sel{border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.04em;cursor:pointer;padding:3px 6px;border-radius:100px;appearance:none;-webkit-appearance:none;}
.status-sel.draft{background:#F3F4F6;color:#6B7280;}
.status-sel.sent{background:var(--blue-bg);color:var(--blue);}
.status-sel.paid{background:var(--teal-bg);color:var(--teal-d);}
.status-sel.overdue{background:var(--red-bg);color:var(--red);}
.status-sel.pending{background:var(--amber-bg);color:var(--amber);}

/* Delete btn */
.delbtn{background:none;border:none;cursor:pointer;color:var(--hint);padding:3px 5px;border-radius:4px;line-height:1;font-size:16px;transition:all 0.12s;}
.delbtn:hover{color:var(--red);background:var(--red-bg);}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:200;padding:1rem;}
.modal{background:var(--white);border-radius:var(--radius);padding:1.75rem;width:460px;max-width:100%;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:16px;font-weight:500;margin-bottom:1.5rem;}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--border);}

/* Form */
.form-group{margin-bottom:1rem;}
.form-label{font-size:12px;color:var(--muted);margin-bottom:5px;display:block;}
.form-input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color 0.12s;background:var(--white);color:var(--text);}
.form-input:focus{border-color:var(--teal);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;background:var(--white);color:var(--text);}
.form-select:focus{border-color:var(--teal);}
.form-hint{font-size:11px;color:var(--muted);margin-top:4px;}

/* Empty state */
.empty{text-align:center;padding:3.5rem 1rem;color:var(--muted);}
.empty-icon{font-size:32px;margin-bottom:12px;opacity:0.4;}
.empty p{font-size:13px;margin-bottom:1rem;}

/* Mini row */
.entry-row-mini{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
.entry-row-mini:last-child{border-bottom:none;}
.period-pill{display:inline-block;font-size:10px;padding:2px 8px;background:var(--bg);border:1px solid var(--border);border-radius:100px;color:var(--muted);margin-left:6px;vertical-align:middle;}

/* Calendar cell hover */
.cal-cell-hover:hover{ filter:brightness(0.95); }
.cal-paid{ background:#FFFBEB!important; border-color:#FCD34D!important; }
.cal-paid .cal-day-num{ color:#92400E!important; }
.cal-paid .cal-day-hrs{ color:#92400E!important; }
.cal-legend{ display:flex; gap:14px; padding:0 1rem 1rem; flex-wrap:wrap; }
.cal-legend-item{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); }
.cal-legend-dot{ width:10px; height:10px; border-radius:3px; border:1px solid; }

/* Month selector */
.month-selector{display:flex;align-items:center;gap:6px;}
.month-selector select{padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text);background:var(--white);outline:none;cursor:pointer;}
.month-selector select:focus{border-color:var(--teal);}

/* Toast */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--text);color:#fff;padding:10px 18px;border-radius:var(--radius-sm);font-size:13px;z-index:999;opacity:0;transform:translateY(8px);transition:all 0.2s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}

/* Admin flag */
.admin-bar{background:var(--amber-bg);border:1px solid #FDE68A;border-radius:var(--radius);padding:10px 16px;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--amber);}
.admin-bar strong{font-weight:500;}

/* Print */
@media print{
  @page{ size:A4; margin:12mm 10mm 12mm 10mm; }
  html,body{ width:210mm; margin:0 auto; }
  .sidebar,.no-print,.admin-bar,.sync-bar{ display:none!important; }
  .main{ margin-left:0!important; padding:0!important; max-width:100%!important; }
  .card{ border:1px solid #ccc!important; break-inside:avoid; }
  /* Invoice detail print: hide back/action bar, show only doc card */
  .inv-print-hide{ display:none!important; }
}

/* Responsive */
@media(max-width:700px){
  .sidebar{display:none;}
  .main{margin-left:0;padding:1rem;}
  .stats-grid{grid-template-columns:1fr 1fr;}
  .form-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
// ── Config ────────────────────────────────────────────────────
const AUTH_HASH = '2321c4635e1eb7dd4877116b80615a86951680a020cc220f39172c24109efe5a';
const PROFILE   = { name:'Stephen Reyes', email:'stephen.reyes.va@gmail.com', role:'E-Commerce Virtual Assistant', rate:5 };
const CLIENT    = { name:'Margarite', company:'All Riot Ltd.' };
const PAYMENT   = { paypal:'stephen.reyes.va@gmail.com' };
const GH        = { user:'stephenreyesva', repo:'timetracker', branch:'main' };

const RATE = 5;
const STATUSES = ['draft','sent','pending','paid','overdue'];
const STATUS_LABELS = {draft:'Draft',sent:'Sent',pending:'Pending',paid:'Paid',overdue:'Overdue'};
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// ── State ─────────────────────────────────────────────────────
let page = 'dashboard';
let modal = null;
let loggedIn = false;
let ghToken = '';
let data = { entries:[], invoices:[] };
let dashMonth = new Date().getMonth();
let dashYear  = new Date().getFullYear();

// ── Helpers ───────────────────────────────────────────────────
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function fmt(n){ return '$'+parseFloat(n||0).toFixed(2); }
function fmtDate(d){ if(!d)return'—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function totalHours(arr){ return arr.reduce((s,e)=>s+(parseFloat(e.hours)||0),0); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2800); }
function getMonthEntries(m,y){ return data.entries.filter(e=>{ if(!e.date)return false; const d=new Date(e.date+'T00:00:00'); return d.getMonth()===m&&d.getFullYear()===y; }); }

// ── Auto-filename print ───────────────────────────────────────
const _defaultTitle='Admin — Stephen Reyes Time Tracker';
function printWithName(filename){
  const old=document.title; document.title=filename;
  window.print();
  setTimeout(()=>{ document.title=old||_defaultTitle; },500);
}
function printInvoiceDoc(inv){
  const clientSlug=(CLIENT.name+CLIENT.company).replace(/[^a-zA-Z0-9]/g,'').slice(0,20);
  printWithName((inv.number||'INV')+'-'+clientSlug);
}
function printTimesheetDoc(dateStr){
  let label;
  if(dateStr){
    const d=new Date(dateStr+'T00:00:00');
    label=String(d.getDate()).padStart(2,'0')+String(d.getMonth()+1).padStart(2,'0')+d.getFullYear();
  } else {
    label='01'+String(tsMonth+1).padStart(2,'0')+tsYear;
  }
  const clientSlug=(CLIENT.name+CLIENT.company).replace(/[^a-zA-Z0-9]/g,'').slice(0,20);
  printWithName(label+'-'+clientSlug);
}

// ── Paid dates (for calendar colouring) ──────────────────────
function getPaidDates(){
  const paidInvs=data.invoices.filter(i=>i.status==='paid');
  const paid=new Set();
  data.entries.forEach(e=>{
    if(!e.date) return;
    const covered=paidInvs.some(inv=>{
      const p=getBiMonthlyPeriods().find(x=>x.label===inv.label);
      if(!p) return false;
      return e.date>=p.start && e.date<=p.end;
    });
    if(covered) paid.add(e.date);
  });
  return paid;
}

// ── Auth ──────────────────────────────────────────────────────
async function hashCreds(u,p){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(u.trim()+':'+p));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function tryLogin(u,p){
  const h=await hashCreds(u,p);
  if(h===AUTH_HASH){ loggedIn=true; sessionStorage.setItem('sr_auth','1'); render(); }
  else{ document.getElementById('login-err').classList.add('show'); }
}
function logout(){ loggedIn=false; sessionStorage.removeItem('sr_auth'); render(); }

// ── Data ─────────────────────────────────────────────────────
function save(){ localStorage.setItem('sr_tracker_v1',JSON.stringify(data)); }
function loadLocal(){ const r=localStorage.getItem('sr_tracker_v1'); if(r){ try{ data=JSON.parse(r); }catch(e){} } }

// ── GitHub sync ───────────────────────────────────────────────
function exportData(){
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='data.json'; a.click();
  toast('data.json downloaded — commit to your repo!');
}
async function syncGitHub(){
  if(!ghToken){ toast('Enter your GitHub token first.'); return; }
  const content=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
  const api=`https://api.github.com/repos/${GH.user}/${GH.repo}/contents/data.json`;
  try{
    let sha='';
    const ex=await fetch(api,{headers:{'Authorization':'token '+ghToken,'Accept':'application/vnd.github.v3+json'}});
    if(ex.ok){ const j=await ex.json(); sha=j.sha; }
    const body={message:'update tracker data',content,branch:GH.branch};
    if(sha) body.sha=sha;
    const res=await fetch(api,{method:'PUT',headers:{'Authorization':'token '+ghToken,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)});
    if(res.ok){ toast('Synced! Client view is now live.'); }
    else{ const e=await res.json(); toast('Error: '+(e.message||'sync failed')); }
  }catch(e){ toast('Sync failed — check your token.'); }
}

// ── Render ────────────────────────────────────────────────────
function render(){
  loadLocal(); // always re-read so dashboard reflects latest timesheet entries
  const root=document.getElementById('root');
  root.innerHTML='';
  if(!loggedIn){ root.appendChild(buildLogin()); return; }
  root.appendChild(buildApp());
}

// ── Login ─────────────────────────────────────────────────────
function buildLogin(){
  const wrap=document.createElement('div'); wrap.className='login-wrap';
  const card=document.createElement('div'); card.className='login-card';
  card.innerHTML=`
    <div class="login-logo">
      <div class="login-logo-name"><span class="login-logo-dot"></span>Stephen Reyes</div>
      <div class="login-logo-role">E-Commerce Virtual Assistant</div>
      <div class="admin-badge">Admin Access</div>
    </div>
    <div class="login-subtitle">Sign in to manage your tracker</div>
    <div class="login-error" id="login-err">Incorrect username or password.</div>
    <div class="form-group"><label class="form-label">Username</label><input id="l-user" class="form-input" type="text" placeholder="Username" autocomplete="username"></div>
    <div class="form-group"><label class="form-label">Password</label><input id="l-pass" class="form-input" type="password" placeholder="Password" autocomplete="current-password"></div>`;
  const btn=document.createElement('button'); btn.className='btn btn-primary';
  btn.style.cssText='width:100%;justify-content:center;padding:10px;margin-top:4px;';
  btn.textContent='Sign in';
  btn.addEventListener('click',()=>tryLogin(document.getElementById('l-user').value,document.getElementById('l-pass').value));
  card.addEventListener('keydown',e=>{ if(e.key==='Enter') tryLogin(document.getElementById('l-user').value,document.getElementById('l-pass').value); });
  const backBtn=document.createElement('button'); backBtn.className='btn btn-outline';
  backBtn.style.cssText='width:100%;justify-content:center;margin-top:8px;';
  backBtn.innerHTML=`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg> Back to client view`;
  backBtn.addEventListener('click',()=>{ window.location.href='index.html'; });
  card.appendChild(btn); card.appendChild(backBtn);
  wrap.appendChild(card); return wrap;
}

// ── App shell ─────────────────────────────────────────────────
function buildApp(){
  const app=document.createElement('div'); app.className='app';
  app.appendChild(buildSidebar());
  const main=document.createElement('div'); main.className='main';

  // Admin notice bar
  const ab=document.createElement('div'); ab.className='admin-bar no-print';
  ab.innerHTML=`<span><strong>Admin mode</strong> — only you can see this view. Changes are saved locally.</span>`;
  const vb=document.createElement('button'); vb.className='btn btn-outline btn-sm';
  vb.innerHTML=`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Client view`;
  vb.addEventListener('click',()=>{ window.location.href='index.html'; });
  ab.appendChild(vb); main.appendChild(ab);

  // GitHub sync bar
  const sb=document.createElement('div'); sb.className='sync-bar no-print';
  const lbl=document.createElement('span'); lbl.className='sync-label'; lbl.textContent='GitHub Sync:';
  const ti=document.createElement('input'); ti.className='form-input'; ti.type='password';
  ti.placeholder='Paste your GitHub PAT to sync data.json…'; ti.value=ghToken; ti.style.cssText='flex:1;min-width:160px;margin:0;';
  ti.addEventListener('input',e=>ghToken=e.target.value);
  const syncBtn=document.createElement('button'); syncBtn.className='btn btn-primary btn-sm';
  syncBtn.innerHTML=`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg> Sync`;
  syncBtn.addEventListener('click',syncGitHub);
  const expBtn=document.createElement('button'); expBtn.className='btn btn-outline btn-sm';
  expBtn.innerHTML=`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export`;
  expBtn.addEventListener('click',exportData);
  sb.appendChild(lbl); sb.appendChild(ti); sb.appendChild(syncBtn); sb.appendChild(expBtn);
  main.appendChild(sb);

  const pages={dashboard:buildDashboard,timesheet:buildTimesheet,invoices:buildInvoices};
  main.appendChild((pages[page]||buildDashboard)());
  app.appendChild(main);
  if(modal) app.appendChild(buildModal());
  return app;
}

// ── Sidebar ───────────────────────────────────────────────────
function buildSidebar(){

// ── Dashboard ─────────────────────────────────────────────────
function buildDashboard(){
  const div=document.createElement('div');

  // Header with month selector
  const hdr=document.createElement('div'); hdr.className='page-header';
  const htxt=document.createElement('div');
  htxt.innerHTML=`<div class="page-title">Dashboard</div><div class="page-sub">Monthly Summary</div>`;
  hdr.appendChild(htxt);

  const ms=document.createElement('div'); ms.className='month-selector no-print';
  const mSel=document.createElement('select');
  MONTHS.forEach((m,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=m; if(i===dashMonth)o.selected=true; mSel.appendChild(o); });
  mSel.addEventListener('change',e=>{ dashMonth=parseInt(e.target.value); render(); });
  const ySel=document.createElement('select');
  const curY=new Date().getFullYear();
  for(let y=curY-2;y<=curY;y++){ const o=document.createElement('option'); o.value=y; o.textContent=y; if(y===dashYear)o.selected=true; ySel.appendChild(o); }
  ySel.addEventListener('change',e=>{ dashYear=parseInt(e.target.value); render(); });
  ms.appendChild(mSel); ms.appendChild(ySel); hdr.appendChild(ms);
  div.appendChild(hdr);

  const mEntries=getMonthEntries(dashMonth,dashYear);
  const allH=totalHours(data.entries), mH=totalHours(mEntries);
  const unpaid=data.invoices.filter(i=>i.status!=='paid').reduce((s,i)=>s+(parseFloat(i.total)||0),0);

  div.innerHTML+=`
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">${MONTHS[dashMonth]} ${dashYear} Hours</div><div class="stat-value teal">${mH.toFixed(1)}</div><div class="stat-sub">${fmt(mH*RATE)} earned</div></div>
      <div class="stat-card"><div class="stat-label">Total Hours Logged</div><div class="stat-value">${allH.toFixed(1)}</div><div class="stat-sub">All time · ${fmt(allH*RATE)}</div></div>
      <div class="stat-card"><div class="stat-label">Outstanding</div><div class="stat-value">${fmt(unpaid)}</div><div class="stat-sub">${data.invoices.filter(i=>i.status!=='paid').length} unpaid invoice(s)</div></div>
    </div>`;

  // Monthly entries — dates clickable → goes to timesheet day
  const card=document.createElement('div'); card.className='card';
  card.innerHTML=`<div class="card-header"><div class="card-title">${MONTHS[dashMonth]} ${dashYear} — Time Entries</div></div>`;
  const body=document.createElement('div'); body.style.padding='0 1.25rem';
  const mSorted=[...mEntries].sort((a,b)=>b.date.localeCompare(a.date));
  if(!mSorted.length){
    body.innerHTML=`<div class="empty"><div class="empty-icon">📋</div><p>No entries for ${MONTHS[dashMonth]} ${dashYear}. Go to Timesheet to log hours.</p></div>`;
  } else {
    // Group by date
    const byDate={};
    mSorted.forEach(e=>{ if(!byDate[e.date])byDate[e.date]=[]; byDate[e.date].push(e); });
    Object.keys(byDate).sort().reverse().forEach(dateStr=>{
      const dayEntries=byDate[dateStr];
      const dayH=totalHours(dayEntries);
      const firstDesc=dayEntries[0].description||'';
      const moreLabel=dayEntries.length>1?` +${dayEntries.length-1} more`:'';
      const r=document.createElement('div'); r.className='entry-row-mini'; r.style.cursor='pointer';
      r.title='Click to view/edit entries for this day';
      const left=document.createElement('div'); left.style.cssText='display:flex;align-items:center;gap:8px;';
      const dateBtn=document.createElement('button');
      dateBtn.style.cssText='background:none;border:none;cursor:pointer;font-size:11px;color:var(--teal);font-family:inherit;font-weight:500;padding:0;text-decoration:underline;text-underline-offset:3px;';
      dateBtn.textContent=fmtDate(dateStr);
      dateBtn.addEventListener('click',ev=>{ ev.stopPropagation(); openDayModal(dateStr); });
      const descSpan=document.createElement('span'); descSpan.style.cssText='color:var(--muted);font-size:12px;';
      descSpan.textContent=(firstDesc||'No description')+moreLabel;
      left.appendChild(dateBtn); left.appendChild(descSpan);
      const right=document.createElement('div'); right.style.cssText='white-space:nowrap;color:var(--teal);font-weight:500;';
      right.innerHTML=`${fmt(dayH*RATE)}<span style="color:var(--hint);font-weight:400;font-size:11px;margin-left:4px">${dayH.toFixed(1)}h</span>`;
      r.appendChild(left); r.appendChild(right);
      r.addEventListener('click',()=>openDayModal(dateStr));
      body.appendChild(r);
    });
    const tot=document.createElement('div'); tot.style.cssText='padding:10px 0;display:flex;justify-content:space-between;font-size:13px;font-weight:500;border-top:1px solid var(--border);margin-top:4px;';
    tot.innerHTML=`<span style="color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:0.06em">Month Total</span><span style="color:var(--teal)">${mH.toFixed(1)}h &nbsp;·&nbsp; ${fmt(mH*RATE)}</span>`;
    body.appendChild(tot);
  }
  card.appendChild(body); div.appendChild(card);

  if(data.invoices.length){
    const ic=document.createElement('div'); ic.className='card'; ic.style.marginTop='1.25rem';
    ic.innerHTML=`<div class="card-header"><div class="card-title">Invoice Overview</div></div>`;
    const ib=document.createElement('div'); ib.style.padding='0 1.25rem';
    [...data.invoices].reverse().slice(0,6).forEach(inv=>{
      const r=document.createElement('div'); r.className='entry-row-mini'; r.style.cursor='pointer';
      r.title='Click to view invoice detail';
      const left=document.createElement('div'); left.style.cssText='display:flex;align-items:center;gap:6px;';
      const numBtn=document.createElement('button');
      numBtn.style.cssText='background:none;border:none;cursor:pointer;font-weight:500;color:var(--teal);font-family:inherit;font-size:13px;padding:0;text-decoration:underline;text-underline-offset:3px;';
      numBtn.textContent=inv.number;
      numBtn.addEventListener('click',ev=>{ ev.stopPropagation(); invoiceDetailId=inv.id; page='invoices'; render(); });
      const pill=document.createElement('span'); pill.className='period-pill'; pill.textContent=inv.label||'—';
      left.appendChild(numBtn); left.appendChild(pill);
      const right=document.createElement('div'); right.style.cssText='display:flex;align-items:center;gap:10px;';
      right.innerHTML=`<span class="badge badge-${inv.status||'draft'}">${STATUS_LABELS[inv.status||'draft']}</span><span style="font-weight:500">${fmt(inv.total||0)}</span>`;
      r.appendChild(left); r.appendChild(right);
      r.addEventListener('click',()=>{ invoiceDetailId=inv.id; page='invoices'; render(); });
      ib.appendChild(r);
    });
    ic.appendChild(ib); div.appendChild(ic);
  }
  return div;
}

// ── Timesheet ─────────────────────────────────────────────────
let tsMonth = new Date().getMonth();
let tsYear  = new Date().getFullYear();

function calcHours(timeIn, timeOut){
  if(!timeIn||!timeOut) return '';
  const [ih,im]=timeIn.split(':').map(Number);
  const [oh,om]=timeOut.split(':').map(Number);
  const diff=(oh*60+om)-(ih*60+im);
  if(diff<=0) return '';
  return (diff/60).toFixed(2);
}

function fmtTime(t){
  if(!t) return '—';
  const [h,m]=t.split(':');
  const hr=parseInt(h);
  return `${hr%12||12}:${m} ${hr<12?'AM':'PM'}`;
}

function buildTimesheet(){

  // ── Page header ───────────────────────────────────────────────
  const hdr=document.createElement('div'); hdr.className='page-header';
  const htxt=document.createElement('div');
  const mEntries=getMonthEntries(tsMonth,tsYear);
  const monthH=totalHours(mEntries);
  htxt.innerHTML=`<div class="page-title">Timesheet</div><div class="page-sub">Rate: $${RATE}/hr &middot; ${MONTHS[tsMonth]} ${tsYear}: ${monthH.toFixed(2)}h &middot; ${fmt(monthH*RATE)}</div>`;
  hdr.appendChild(htxt);

  const controls=document.createElement('div'); controls.style.cssText='display:flex;align-items:center;gap:8px;flex-wrap:wrap;';

  // Month + Year selectors
  const mSel=document.createElement('select'); mSel.className='form-select'; mSel.style.cssText='width:auto;padding:5px 8px;font-size:12px;';
  MONTHS.forEach((m,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=m; if(i===tsMonth)o.selected=true; mSel.appendChild(o); });
  mSel.addEventListener('change',e=>{ tsMonth=parseInt(e.target.value); render(); });
  const ySel=document.createElement('select'); ySel.className='form-select'; ySel.style.cssText='width:auto;padding:5px 8px;font-size:12px;';
  const curY=new Date().getFullYear();
  for(let y=curY-2;y<=curY+1;y++){ const o=document.createElement('option'); o.value=y; o.textContent=y; if(y===tsYear)o.selected=true; ySel.appendChild(o); }
  ySel.addEventListener('change',e=>{ tsYear=parseInt(e.target.value); render(); });

  // Add entry button
  const ab=document.createElement('button'); ab.className='btn btn-primary btn-sm';
  ab.innerHTML=`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add entry`;
  ab.addEventListener('click',()=>openEntryModal());

  // Print button
  const pb=document.createElement('button'); pb.className='btn btn-outline btn-sm';
  pb.innerHTML=`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Print`;
  pb.addEventListener('click',()=>printTimesheetDoc(null));

  controls.appendChild(mSel); controls.appendChild(ySel); controls.appendChild(ab); controls.appendChild(pb);
  hdr.appendChild(controls);
  div.appendChild(hdr);

  // ── Calendar card ─────────────────────────────────────────────
  const calWrap=document.createElement('div'); calWrap.className='card'; calWrap.style.marginBottom='1.25rem';
  const calHdr=document.createElement('div'); calHdr.className='card-header';
  calHdr.innerHTML=`<div class="card-title">${MONTHS[tsMonth]} ${tsYear}</div>
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:12px;color:var(--muted)">${monthH.toFixed(2)}h &middot; ${fmt(monthH*RATE)}</span>
    </div>`;
  calWrap.appendChild(calHdr);

  const calBody=document.createElement('div'); calBody.style.padding='1rem';
  const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const grid=document.createElement('div'); grid.style.cssText='display:grid;grid-template-columns:repeat(7,1fr);gap:4px;';

  // Day header labels
  dayNames.forEach(d=>{
    const dn=document.createElement('div');
    dn.style.cssText='text-align:center;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);padding:4px 0;';
    dn.textContent=d; grid.appendChild(dn);
  });

  const firstDay=new Date(tsYear,tsMonth,1).getDay();
  const daysInMonth=new Date(tsYear,tsMonth+1,0).getDate();
  const todayObj=new Date();
  const paidDates=getPaidDates();

  // Blank leading cells
  for(let i=0;i<firstDay;i++){
    const blank=document.createElement('div'); blank.style.cssText='min-height:62px;border-radius:6px;background:transparent;';
    grid.appendChild(blank);
  }

  // Day cells — ALL days are clickable
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${tsYear}-${String(tsMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayEntries=data.entries.filter(e=>e.date===dateStr);
    const dayH=totalHours(dayEntries);
    const isToday=todayObj.getDate()===d&&todayObj.getMonth()===tsMonth&&todayObj.getFullYear()===tsYear;
    const hasEntry=dayEntries.length>0;
    const isPaid=hasEntry&&paidDates.has(dateStr);

    const cell=document.createElement('div');
    // Colour: paid (yellow) > logged (green) > today (teal outline) > empty (white)
    let bg,borderColor,numColor,hrsColor;
    if(isPaid){
      bg='#FFFBEB'; borderColor='#FCD34D'; numColor='#92400E'; hrsColor='#92400E';
    } else if(hasEntry){
      bg='var(--teal-bg)'; borderColor='var(--teal-mid)'; numColor='var(--teal-d)'; hrsColor='var(--teal-d)';
    } else if(isToday){
      bg='#F0FDF9'; borderColor='var(--teal)'; numColor='var(--teal)'; hrsColor='var(--muted)';
    } else {
      bg='var(--white)'; borderColor='var(--border)'; numColor='var(--muted)'; hrsColor='var(--muted)';
    }

    const boxShadow=isToday&&!hasEntry?'box-shadow:0 0 0 2px var(--teal);':'';
    cell.style.cssText=`min-height:62px;border-radius:6px;padding:5px 6px;cursor:pointer;border:1px solid ${borderColor};background:${bg};transition:all 0.12s;${boxShadow}`;
    cell.title=hasEntry
      ? `${dayEntries.length} entr${dayEntries.length>1?'ies':'y'} · ${dayH.toFixed(2)}h${isPaid?' · ✓ Invoice paid':''} — click to view/edit`
      : 'Click to add entry for this day';
    cell.addEventListener('click',()=>openDayModal(dateStr));

    // Day number
    const dayNum=document.createElement('div');
    dayNum.style.cssText=`font-size:11px;font-weight:${isToday?'700':'500'};color:${numColor};`;
    dayNum.textContent=d; cell.appendChild(dayNum);

    if(hasEntry){
      const hrsEl=document.createElement('div');
      hrsEl.style.cssText=`font-size:11px;font-weight:600;color:${hrsColor};margin-top:3px;`;
      hrsEl.textContent=dayH.toFixed(2)+'h'; cell.appendChild(hrsEl);
      if(dayEntries.length>1){
        const cnt=document.createElement('div'); cnt.style.cssText='font-size:9px;color:var(--teal-d);margin-top:1px;';
        cnt.textContent=dayEntries.length+' entries'; cell.appendChild(cnt);
      }
      if(isPaid){
        const paidDot=document.createElement('div'); paidDot.style.cssText='font-size:9px;color:#92400E;margin-top:2px;font-weight:600;';
        paidDot.textContent='✓ paid'; cell.appendChild(paidDot);
      }
    } else {
      // Empty day: show small + hint
      const addHint=document.createElement('div');
      addHint.style.cssText='font-size:10px;color:var(--hint);margin-top:6px;text-align:center;';
      addHint.textContent='+'; cell.appendChild(addHint);
    }
    grid.appendChild(cell);
  }
  calBody.appendChild(grid);

  // Legend
  const legend=document.createElement('div'); legend.className='cal-legend';
  legend.innerHTML=`
    <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--white);border-color:var(--border)"></div>No entry (click to add)</div>
    <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--teal-bg);border-color:var(--teal-mid)"></div>Hours logged</div>
    <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#FFFBEB;border-color:#FCD34D"></div>Invoice paid</div>`;
  calBody.appendChild(legend);
  calWrap.appendChild(calBody);
  div.appendChild(calWrap);

  // ── Bi-monthly summary strip ──────────────────────────────────
  const lastDay=new Date(tsYear,tsMonth+1,0).getDate();
  const periods=[
    {label:`1 – 15`, start:`${tsYear}-${String(tsMonth+1).padStart(2,'0')}-01`, end:`${tsYear}-${String(tsMonth+1).padStart(2,'0')}-15`},
    {label:`16 – ${lastDay}`, start:`${tsYear}-${String(tsMonth+1).padStart(2,'0')}-16`, end:`${tsYear}-${String(tsMonth+1).padStart(2,'0')}-${lastDay}`},
  ];
  const summaryStrip=document.createElement('div');
  summaryStrip.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.25rem;';
  periods.forEach(p=>{
    const pEntries=data.entries.filter(e=>e.date>=p.start&&e.date<=p.end);
    const pH=totalHours(pEntries);
    const matchingInv=data.invoices.find(inv=>inv.label&&inv.label.includes(MONTHS[tsMonth])&&inv.label.includes(String(tsYear))&&inv.label.match(/(\d+)\s*[–\-]\s*(\d+)/)&&(()=>{ const m=inv.label.match(/(\d+)\s*[–\-]\s*(\d+)/); return parseInt(m[1])===parseInt(p.label.split(/\s*[–\-]\s*/)[0]); })());
    const invStatus=matchingInv?matchingInv.status:null;
    const stripCard=document.createElement('div'); stripCard.className='card';
    stripCard.style.cssText='padding:10px 14px;';
    const statusHtml=invStatus?`<span class="badge badge-${invStatus}" style="font-size:10px">${STATUS_LABELS[invStatus]}</span>`:'<span style="font-size:11px;color:var(--hint)">No invoice</span>';
    stripCard.innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);font-weight:600;margin-bottom:4px">${MONTHS[tsMonth]} ${p.label}</div>
          <div style="font-size:20px;font-weight:600;color:var(--teal)">${pH.toFixed(2)}<span style="font-size:12px;font-weight:400;color:var(--muted)">h</span></div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">${fmt(pH*RATE)}</div>
        </div>
        <div style="text-align:right">${statusHtml}</div>
      </div>`;
    summaryStrip.appendChild(stripCard);
  });
  div.appendChild(summaryStrip);

  // ── Detailed log table ────────────────────────────────────────
  const card=document.createElement('div'); card.className='card';
  const tblHdr=document.createElement('div'); tblHdr.className='card-header';
  tblHdr.innerHTML=`<div class="card-title">${MONTHS[tsMonth]} ${tsYear} — Detailed Log</div><div style="font-size:11px;color:var(--hint)">Click any row or date to edit · ✕ to delete</div>`;
  card.appendChild(tblHdr);

  if(!mEntries.length){
    card.innerHTML+=`<div class="empty"><div class="empty-icon">⏱</div><p>No entries for ${MONTHS[tsMonth]} ${tsYear}.</p><button class="btn btn-primary btn-sm" id="ts-empty-add">Log first entry</button></div>`;
    div.appendChild(card);
    setTimeout(()=>{ const b=document.getElementById('ts-empty-add'); if(b) b.addEventListener('click',()=>openEntryModal()); },0);
    return div;
  }

  const sorted=[...mEntries].sort((a,b)=>a.date.localeCompare(b.date));
  const wrap=document.createElement('div'); wrap.className='table-wrap';
  const tbl=document.createElement('table');
  tbl.innerHTML=`<thead><tr>
    <th>Date</th><th>Time In</th><th>Time Out</th><th>Description</th>
    <th style="text-align:right">Hours</th><th style="text-align:right">Amount</th><th></th>
  </tr></thead>`;
  const tbody=document.createElement('tbody');

  // Group by date for visual separation
  let lastDate='';
  sorted.forEach(e=>{
    const isPaidEntry=paidDates.has(e.date);
    const tr=document.createElement('tr'); tr.style.cursor='pointer'; tr.title='Click to edit this entry';
    if(e.date!==lastDate&&lastDate!==''){
      tr.style.borderTop='2px solid var(--border)';
    }
    lastDate=e.date;

    // Date cell — underlined, clickable to open day modal
    const dateTd=document.createElement('td');
    const dateBtn=document.createElement('button');
    dateBtn.style.cssText='background:none;border:none;cursor:pointer;font-weight:600;font-family:inherit;font-size:13px;padding:0;white-space:nowrap;text-decoration:underline;text-underline-offset:3px;';
    dateBtn.style.color=isPaidEntry?'#92400E':'var(--teal)';
    dateBtn.textContent=fmtDate(e.date);
    dateBtn.title='Click to view/edit all entries for this day';
    dateBtn.addEventListener('click',ev=>{ ev.stopPropagation(); openDayModal(e.date); });
    if(isPaidEntry){
      const paidTag=document.createElement('span');
      paidTag.style.cssText='font-size:9px;background:#FCD34D;color:#92400E;padding:1px 5px;border-radius:100px;margin-left:5px;font-weight:600;';
      paidTag.textContent='PAID'; dateTd.appendChild(dateBtn); dateTd.appendChild(paidTag);
    } else { dateTd.appendChild(dateBtn); }
    tr.appendChild(dateTd);

    tr.innerHTML+=`
      <td style="color:var(--muted);font-size:12px">${fmtTime(e.timeIn)}</td>
      <td style="color:var(--muted);font-size:12px">${fmtTime(e.timeOut)}</td>
      <td>${e.description||'<span style="color:var(--hint)">—</span>'}</td>
      <td style="text-align:right">${parseFloat(e.hours||0).toFixed(2)}h</td>
      <td style="text-align:right;font-weight:500;color:${isPaidEntry?'#92400E':'var(--teal)'}">${fmt((parseFloat(e.hours)||0)*RATE)}</td>`;

    if(isPaidEntry){
      // LOCKED — paid invoice, no editing or deleting
      tr.style.cursor='default'; tr.title='';
      tr.style.background='#FFFBEB';
      tr.addEventListener('click',ev=>{ if(ev.target.tagName==='BUTTON'||ev.target.closest('button')) return; toast('🔒 This entry is locked — it belongs to a paid invoice.'); });

// Generate bi-monthly period options (12 months back to 3 months ahead)
function getBiMonthlyPeriods(){
  const periods=[];
  const now=new Date();
  for(let offset=-12; offset<=3; offset++){
    const d=new Date(now.getFullYear(), now.getMonth()+offset, 1);
    const m=d.getMonth(); const y=d.getFullYear();
    const lastDay=new Date(y,m+1,0).getDate();
    const mName=MONTHS[m];
    periods.push({ label:`${mName} 1–15, ${y}`,  start:`${y}-${String(m+1).padStart(2,'0')}-01`, end:`${y}-${String(m+1).padStart(2,'0')}-15` });
    periods.push({ label:`${mName} 16–${lastDay}, ${y}`, start:`${y}-${String(m+1).padStart(2,'0')}-16`, end:`${y}-${String(m+1).padStart(2,'0')}-${lastDay}` });
  }
  return periods;
}

// Get entries that fall within a period label
function getEntriesForPeriod(label){
  const p=getBiMonthlyPeriods().find(x=>x.label===label);
  if(!p) return [];
  return data.entries.filter(e=>e.date && e.date>=p.start && e.date<=p.end);
}

// Calculate PayPal fee (3.49% + $0.49 standard)
function calcPaypalFee(amount, feeOverride){
  if(feeOverride!==undefined && feeOverride!=='') return parseFloat(feeOverride)||0;
  return Math.round((amount*0.0450+0.49)*100)/100;
}

  ov.addEventListener('click',e=>{ if(e.target===ov){ modal=null; render(); }});
  const m=document.createElement('div'); m.className='modal';
  const foot=(saveLabel)=>{ const f=document.createElement('div'); f.className='modal-footer'; const c=document.createElement('button'); c.className='btn btn-outline'; c.textContent='Cancel'; c.addEventListener('click',()=>{ modal=null; render(); }); const s=document.createElement('button'); s.className='btn btn-primary'; s.textContent=saveLabel||'Save'; s.addEventListener('click',()=>modal.onSave()); f.appendChild(c); f.appendChild(s); return f; };

  // ── Day overview modal ────────────────────────────────────────
  if(modal.type==='day'){
    const dateStr=modal.date;
    const dt=new Date(dateStr+'T00:00:00');
    const dayEntries=data.entries.filter(e=>e.date===dateStr).sort((a,b)=>(a.timeIn||'').localeCompare(b.timeIn||''));
    const dayH=totalHours(dayEntries);
    const paidDates=getPaidDates();
    const isPaid=dayEntries.length>0&&paidDates.has(dateStr);

    // Title row
    const titleRow=document.createElement('div'); titleRow.style.cssText='display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.25rem;';
    const titleLeft=document.createElement('div');
    titleLeft.innerHTML=`<div class="modal-title" style="margin-bottom:4px">${dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</div>`;
    if(isPaid){
      const pBadge=document.createElement('span'); pBadge.className='badge badge-paid'; pBadge.textContent='Invoice Paid';
      titleLeft.appendChild(pBadge);
    }
    titleRow.appendChild(titleLeft);
    m.appendChild(titleRow);

    if(!dayEntries.length){
      const empty=document.createElement('div'); empty.style.cssText='text-align:center;padding:1.5rem 0;color:var(--muted);font-size:13px;';
      empty.innerHTML=`<div style="font-size:28px;margin-bottom:8px;opacity:0.3;">⏱</div>No entries for this day.`;
      m.appendChild(empty);
    } else {
      // Entries list
      dayEntries.forEach(e=>{
        const row=document.createElement('div');
        row.style.cssText='display:grid;grid-template-columns:1fr auto;align-items:start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);';
        const left=document.createElement('div');
        left.innerHTML=`
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;">
            <span style="font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:2px 7px;">${fmtTime(e.timeIn)} – ${fmtTime(e.timeOut)}</span>
            <span style="font-size:11px;font-weight:600;color:var(--teal)">${parseFloat(e.hours||0).toFixed(2)}h &nbsp;·&nbsp; ${fmt((parseFloat(e.hours)||0)*RATE)}</span>
          </div>
          <div style="font-size:13px;color:var(--text)">${e.description||'<span style="color:var(--hint)">No description</span>'}</div>`;
        const right=document.createElement('div'); right.style.cssText='display:flex;gap:6px;align-items:center;padding-top:2px;';
        if(isPaid){
          const lockSpan=document.createElement('span');
          lockSpan.textContent='🔒 Locked';
          lockSpan.title='Entry locked — belongs to a paid invoice';
          lockSpan.style.cssText='font-size:11px;color:#92400E;background:#FEF3C7;border:1px solid #FCD34D;padding:2px 8px;border-radius:100px;font-weight:500;';
          right.appendChild(lockSpan);
        } else {
          const editBtn=document.createElement('button'); editBtn.className='btn btn-outline btn-sm'; editBtn.textContent='Edit';
          editBtn.addEventListener('click',()=>openEditEntryModal(e.id));
          const delBtn=document.createElement('button'); delBtn.className='delbtn'; delBtn.innerHTML='&times;'; delBtn.title='Delete';
          delBtn.addEventListener('click',()=>{
            if(confirm('Delete this entry?')){ data.entries=data.entries.filter(x=>x.id!==e.id); save(); openDayModal(dateStr); }
          });
          right.appendChild(editBtn); right.appendChild(delBtn);
        }
        row.appendChild(left); row.appendChild(right); m.appendChild(row);
      });

      // Day total bar
      const totBar=document.createElement('div'); totBar.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--teal-bg);border-radius:var(--radius-sm);margin-top:10px;';
      totBar.innerHTML=`<span style="font-size:12px;color:var(--teal-d);text-transform:uppercase;letter-spacing:0.06em;font-weight:600">Day Total</span><span style="font-size:15px;font-weight:700;color:var(--teal-d)">${dayH.toFixed(2)}h &nbsp;·&nbsp; ${fmt(dayH*RATE)}</span>`;
      m.appendChild(totBar);
    }

    // Add entry — disabled if day belongs to a paid invoice
    if(isPaid){
      const lockNote=document.createElement('div');
      lockNote.style.cssText='margin-top:1rem;background:#FEF3C7;border:1px solid #FCD34D;border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;color:#92400E;display:flex;align-items:center;gap:8px;';
      lockNote.innerHTML=`🔒 <span><strong>Locked period.</strong> This day is covered by a paid invoice. Entries cannot be added, edited, or deleted.</span>`;
      m.appendChild(lockNote);
    } else {
      const addBtn=document.createElement('button'); addBtn.className='btn btn-primary'; addBtn.style.cssText='width:100%;justify-content:center;margin-top:1rem;';
      addBtn.innerHTML=`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add entry for this day`;
      addBtn.addEventListener('click',()=>openEntryModal(dateStr));
      m.appendChild(addBtn);
    }

    const cf=document.createElement('div'); cf.className='modal-footer';
    const cl=document.createElement('button'); cl.className='btn btn-outline'; cl.textContent='Close';
    cl.addEventListener('click',()=>{ modal=null; render(); }); cf.appendChild(cl); m.appendChild(cf);
    ov.appendChild(m); return ov;
  }

  // Edit existing entry — block if locked
  if(modal.type==='editEntry'){
    const paidDates=getPaidDates();
    const isLocked=paidDates.has(modal.data.date);
    m.innerHTML=`<div class="modal-title">${isLocked?'View Entry (Locked)':'Edit Entry'}</div>`;
    if(isLocked){
      const lockBanner=document.createElement('div');
      lockBanner.style.cssText='background:#FEF3C7;border:1px solid #FCD34D;border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;color:#92400E;margin-bottom:1rem;display:flex;align-items:center;gap:8px;';
      lockBanner.innerHTML=`🔒 <span><strong>This entry is locked.</strong> It belongs to a paid invoice and cannot be edited.</span>`;
      m.appendChild(lockBanner);
      // Show read-only view
      const info=document.createElement('div'); info.style.cssText='display:grid;gap:8px;font-size:13px;';
      const d=modal.data;
      info.innerHTML=`
        <div style="display:flex;gap:8px;">
          <span style="color:var(--muted);min-width:90px">Date:</span><strong>${fmtDate(d.date)}</strong>
        </div>
        <div style="display:flex;gap:8px;">
          <span style="color:var(--muted);min-width:90px">Time:</span><strong>${fmtTime(d.timeIn)} – ${fmtTime(d.timeOut)}</strong>
        </div>
        <div style="display:flex;gap:8px;">
          <span style="color:var(--muted);min-width:90px">Hours:</span><strong>${parseFloat(d.hours||0).toFixed(2)}h &nbsp;·&nbsp; ${fmt((parseFloat(d.hours)||0)*RATE)}</strong>
        </div>
        <div style="display:flex;gap:8px;">
          <span style="color:var(--muted);min-width:90px">Description:</span><span>${d.description||'—'}</span>
        </div>`;
      m.appendChild(info);
      const cf=document.createElement('div'); cf.className='modal-footer';
      const cl=document.createElement('button'); cl.className='btn btn-outline'; cl.textContent='Close';
      cl.addEventListener('click',()=>{ modal=null; render(); }); cf.appendChild(cl); m.appendChild(cf);
    } else {
      buildEntryForm(m, modal.data, true);
      m.appendChild(foot('Save changes'));
    }
    ov.appendChild(m); return ov;
  }

  if(modal.type==='entry'){
    m.innerHTML=`<div class="modal-title">Log time entry</div>`;
    buildEntryForm(m, modal.data, false);
    m.appendChild(foot('Save entry'));
    ov.appendChild(m); return ov;
  }
  if(modal.type==='invoice'){
    const md=modal.data;
    m.innerHTML=`<div class="modal-title">${modal.isEdit?'Edit Invoice':'Create Invoice'}</div>`;

    // Invoice # + Status row
    const r1=document.createElement('div'); r1.className='form-row';
    const sg=document.createElement('div'); sg.className='form-group'; sg.innerHTML=`<label class="form-label">Status</label>`;
    const sel=document.createElement('select'); sel.className='form-select';
    STATUSES.forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=STATUS_LABELS[s]; if(s===md.status)o.selected=true; sel.appendChild(o); });
    sel.addEventListener('change',e=>md.status=e.target.value); sg.appendChild(sel);
    r1.appendChild(fg('Invoice number','text',md.number,'INV-001',v=>md.number=v));
    r1.appendChild(sg); m.appendChild(r1);

    // Period label dropdown
    const pg=document.createElement('div'); pg.className='form-group';
    pg.innerHTML=`<label class="form-label">Period <span style="color:var(--hint);font-weight:400">(bi-monthly)</span></label>`;
    const pSel=document.createElement('select'); pSel.className='form-select'; pSel.id='period-sel';
    const blankOpt=document.createElement('option'); blankOpt.value=''; blankOpt.textContent='— Select period —'; pSel.appendChild(blankOpt);
    getBiMonthlyPeriods().reverse().forEach(p=>{
      const o=document.createElement('option'); o.value=p.label; o.textContent=p.label;
      if(p.label===md.label) o.selected=true; pSel.appendChild(o);
    });
    pSel.addEventListener('change',e=>{
      md.label=e.target.value;
      // Auto-calculate hours from timesheet
      const entries=getEntriesForPeriod(md.label);
      const h=totalHours(entries);
      md.hours=h.toFixed(2);
      const sub=h*RATE;
      md.subtotal=sub.toFixed(2);
      const fee=calcPaypalFee(sub);
      md.paypalFee=fee.toFixed(2);
      // Update displayed fields
      const hf=document.getElementById('inv-hours'); if(hf) hf.value=md.hours;
      const sf=document.getElementById('inv-sub');   if(sf) sf.value=md.subtotal;
      const ff=document.getElementById('inv-fee');   if(ff) ff.value=md.paypalFee;
      const tf2=document.getElementById('inv-total'); if(tf2) tf2.textContent=fmt((parseFloat(md.subtotal)||0)+(parseFloat(md.paypalFee)||0));
      // Show breakdown preview
      updateBreakdownPreview(entries, md);
    });
    pg.appendChild(pSel); m.appendChild(pg);

    // Breakdown preview area
    const bpArea=document.createElement('div'); bpArea.id='breakdown-preview'; m.appendChild(bpArea);
    if(md.label){ updateBreakdownPreview(getEntriesForPeriod(md.label), md, bpArea); }

    // Hours + Subtotal row (read-only, auto-filled)
    const r2=document.createElement('div'); r2.className='form-row';
    const hg=document.createElement('div'); hg.className='form-group';
    hg.innerHTML=`<label class="form-label">Total Hours <span style="color:var(--hint);font-weight:400">(auto)</span></label>`;
    const hInp=document.createElement('input'); hInp.className='form-input'; hInp.type='number'; hInp.id='inv-hours';
    hInp.value=md.hours||''; hInp.style.background='var(--bg)'; hInp.readOnly=true;
    hg.appendChild(hInp);
    const subg=document.createElement('div'); subg.className='form-group';
    subg.innerHTML=`<label class="form-label">Subtotal ($)</label>`;
    const subInp=document.createElement('input'); subInp.className='form-input'; subInp.type='number'; subInp.id='inv-sub';
    subInp.value=md.subtotal||''; subInp.style.background='var(--bg)'; subInp.readOnly=true;
    subg.appendChild(subInp);
    r2.appendChild(hg); r2.appendChild(subg); m.appendChild(r2);

    // PayPal fee row
    const r3=document.createElement('div'); r3.className='form-row';
    const fg2=document.createElement('div'); fg2.className='form-group';
    fg2.innerHTML=`<label class="form-label">PayPal Fee <span style="color:var(--hint);font-weight:400">(3.49% + $0.49, editable)</span></label>`;
    const fInp=document.createElement('input'); fInp.className='form-input'; fInp.type='number'; fInp.id='inv-fee';
    fInp.value=md.paypalFee||''; fInp.step='0.01'; fInp.placeholder='Auto-calculated';
    fInp.addEventListener('input',e=>{
      md.paypalFee=e.target.value;
      const tf2=document.getElementById('inv-total');
      if(tf2) tf2.textContent=fmt((parseFloat(md.subtotal)||0)+(parseFloat(md.paypalFee)||0));
    });
    fg2.appendChild(fInp);
    const tg2=document.createElement('div'); tg2.className='form-group';
    tg2.innerHTML=`<label class="form-label">Total Due</label><div id="inv-total" style="font-size:18px;font-weight:600;color:var(--teal);padding:8px 0;">${fmt((parseFloat(md.subtotal||0))+(parseFloat(md.paypalFee||0)))}</div>`;
    r3.appendChild(fg2); r3.appendChild(tg2); m.appendChild(r3);

    m.appendChild(fg('Notes','text',md.notes||'','e.g. Payment due in 7 days',v=>md.notes=v));

    // Email note for "sent"
    const eNote=document.createElement('div'); eNote.style.cssText='background:var(--blue-bg);border:1px solid #BFDBFE;border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;color:var(--blue);margin-top:4px;';
    eNote.innerHTML=`📧 <strong>Email:</strong> Setting status to <em>Sent</em> will trigger an email notification to Margarite (email TBD). <a href="#" style="color:var(--blue)" onclick="return false">Configure email</a>`;
    m.appendChild(eNote);

    m.appendChild(foot(modal.isEdit?'Save changes':'Create invoice'));
  }
  ov.appendChild(m); return ov;
}

// ── Init ──────────────────────────────────────────────────────
loadLocal();
if(sessionStorage.getItem('sr_auth')==='1') loggedIn=true;
render();
</script>
</body>
</html>
